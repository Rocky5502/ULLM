name: Paper build

on:
  push:
    paths:
      - 'paper/**'
      - 'scripts/validate_references.py'
      - 'scripts/check_latex_log.py'
      - '.github/workflows/paper.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'scripts/validate_references.py'
      - 'scripts/check_latex_log.py'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit citation keys before compile
        run: python scripts/validate_references.py
      - name: Compile provisional AAAI-style manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Audit final LaTeX log quality
        run: python scripts/check_latex_log.py paper/main.log
      - name: Package exact committed Overleaf source
        run: |
          git archive --format=zip --output=ULLM_IASEAI27_Overleaf.zip HEAD:paper
          unzip -l ULLM_IASEAI27_Overleaf.zip
      - name: Upload compiled manuscript
        uses: actions/upload-artifact@v4
        with:
          name: ullm-paper-pdf
          path: paper/main.pdf
          if-no-files-found: error
      - name: Upload Overleaf source package
        uses: actions/upload-artifact@v4
        with:
          name: ullm-overleaf-source
          path: ULLM_IASEAI27_Overleaf.zip
          if-no-files-found: error
