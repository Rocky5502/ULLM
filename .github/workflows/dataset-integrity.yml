name: Dataset and offline rehearsal

on:
  push:
    paths:
      - 'data/**'
      - 'configs/**'
      - 'src/ullm/run.py'
      - 'src/ullm/prompts.py'
      - 'src/ullm/schemas.py'
      - 'scripts/fetch_imperfective_nli.py'
      - 'scripts/validate_dataset.py'
      - 'scripts/validate_project.py'
      - 'scripts/preflight.py'
      - 'scripts/audit_request_plan.py'
      - 'scripts/offline_rehearsal.py'
      - 'scripts/environment_snapshot.py'
      - 'requirements-frozen.txt'
      - '.github/workflows/dataset-integrity.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'configs/**'
      - 'src/ullm/run.py'
      - 'src/ullm/prompts.py'
      - 'src/ullm/schemas.py'
      - 'scripts/fetch_imperfective_nli.py'
      - 'scripts/validate_dataset.py'
      - 'scripts/validate_project.py'
      - 'scripts/preflight.py'
      - 'scripts/audit_request_plan.py'
      - 'scripts/offline_rehearsal.py'
      - 'scripts/environment_snapshot.py'
      - 'requirements-frozen.txt'
      - '.github/workflows/dataset-integrity.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  exact-data-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen tested environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-frozen.txt
          python -m pip check
      - name: Fetch immutable ImperfectiveNLI artifact
        run: python scripts/fetch_imperfective_nli.py
      - name: Validate dataset structure and pairing
        run: python scripts/validate_dataset.py data/imperfectiveNLI.json
      - name: Validate local preflight without API key
        env:
          PYTHONPATH: src
        run: python scripts/preflight.py
      - name: Rehearse all 15,800 main-study requests without API access
        env:
          PYTHONPATH: src
        run: python scripts/offline_rehearsal.py
      - name: Record credential-safe CI environment snapshot
        run: python scripts/environment_snapshot.py --out artifacts/local/ci_environment.json
      - name: Upload provenance, environment, and rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: ullm-offline-freeze-artifacts
          path: |
            data/MANIFEST.local.json
            data/dataset_manifest.json
            artifacts/local/offline_rehearsal_*.json
            artifacts/local/ci_environment.json
          if-no-files-found: error
