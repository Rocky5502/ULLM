name: Export frozen Windows delivery bundle

on:
  push:
    branches: [windows-delivery]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen experiment commit
        uses: actions/checkout@v4
        with:
          ref: d1fac08aaf06e42259e7ace6415b64877313ca2c
          fetch-depth: 0

      - name: Create self-contained Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git branch -f experiment-ready-v2 d1fac08aaf06e42259e7ace6415b64877313ca2c
          git bundle create ULLM-experiment-ready-v2.bundle experiment-ready-v2
          git bundle verify ULLM-experiment-ready-v2.bundle
          sha256sum ULLM-experiment-ready-v2.bundle | tee ULLM-experiment-ready-v2.bundle.sha256
          printf '%s\n' 'd1fac08aaf06e42259e7ace6415b64877313ca2c' > FROZEN_COMMIT.txt

      - name: Upload Windows delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: ULLM-experiment-ready-v2-windows
          path: |
            ULLM-experiment-ready-v2.bundle
            ULLM-experiment-ready-v2.bundle.sha256
            FROZEN_COMMIT.txt
          if-no-files-found: error
          retention-days: 7
