name: Export frozen Windows delivery bundle

on:
  push:
    branches: [windows-delivery]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen experiment commit
        uses: actions/checkout@v4
        with:
          ref: d17d118709d5f6c6f3f9752fc757db86f0ac38ce
          fetch-depth: 0

      - name: Create self-contained Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git branch -f experiment-ready-v5 d17d118709d5f6c6f3f9752fc757db86f0ac38ce
          git bundle create ULLM-experiment-ready-v5.bundle experiment-ready-v5
          git bundle verify ULLM-experiment-ready-v5.bundle
          sha256sum ULLM-experiment-ready-v5.bundle | tee ULLM-experiment-ready-v5.bundle.sha256
          printf '%s\n' 'd17d118709d5f6c6f3f9752fc757db86f0ac38ce' > FROZEN_COMMIT.txt

      - name: Upload Windows delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: ULLM-experiment-ready-v5-windows
          path: |
            ULLM-experiment-ready-v5.bundle
            ULLM-experiment-ready-v5.bundle.sha256
            FROZEN_COMMIT.txt
          if-no-files-found: error
          retention-days: 7
