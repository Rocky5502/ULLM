name: Export frozen Windows delivery bundle

on:
  push:
    branches: [windows-delivery]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen analysis commit
        uses: actions/checkout@v4
        with:
          ref: 7852a938c27c076e55277898060aaa3e2ee5ce8e
          fetch-depth: 0

      - name: Create self-contained Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git branch -f analysis-ready-v2 7852a938c27c076e55277898060aaa3e2ee5ce8e
          git bundle create ULLM-analysis-ready-v2.bundle analysis-ready-v2
          git bundle verify ULLM-analysis-ready-v2.bundle
          sha256sum ULLM-analysis-ready-v2.bundle | tee ULLM-analysis-ready-v2.bundle.sha256
          printf '%s\n' '7852a938c27c076e55277898060aaa3e2ee5ce8e' > FROZEN_COMMIT.txt

      - name: Upload Windows delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: ULLM-analysis-ready-v2-windows
          path: |
            ULLM-analysis-ready-v2.bundle
            ULLM-analysis-ready-v2.bundle.sha256
            FROZEN_COMMIT.txt
          if-no-files-found: error
          retention-days: 7
