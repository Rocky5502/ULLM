name: Export frozen Windows delivery bundle

on:
  push:
    branches: [windows-delivery]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen analysis commit
        uses: actions/checkout@v4
        with:
          ref: ebc0ebe56350dc3822f690142bc5de1cf5ad2c2a
          fetch-depth: 0

      - name: Create self-contained Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git branch -f analysis-ready-v3 ebc0ebe56350dc3822f690142bc5de1cf5ad2c2a
          git bundle create ULLM-analysis-ready-v3.bundle analysis-ready-v3
          git bundle verify ULLM-analysis-ready-v3.bundle
          sha256sum ULLM-analysis-ready-v3.bundle | tee ULLM-analysis-ready-v3.bundle.sha256
          printf '%s\n' 'ebc0ebe56350dc3822f690142bc5de1cf5ad2c2a' > FROZEN_COMMIT.txt

      - name: Upload Windows delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: ULLM-analysis-ready-v3-windows
          path: |
            ULLM-analysis-ready-v3.bundle
            ULLM-analysis-ready-v3.bundle.sha256
            FROZEN_COMMIT.txt
          if-no-files-found: error
          retention-days: 7
