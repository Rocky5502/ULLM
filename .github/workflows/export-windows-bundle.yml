name: Export frozen Windows delivery bundle

on:
  push:
    branches: [windows-delivery]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen experiment commit
        uses: actions/checkout@v4
        with:
          ref: 8b4ccab4509e42da7d315e1161085e5a99591181
          fetch-depth: 0

      - name: Create self-contained Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git branch -f experiment-ready-v1 8b4ccab4509e42da7d315e1161085e5a99591181
          git bundle create ULLM-experiment-ready-v1.bundle experiment-ready-v1
          git bundle verify ULLM-experiment-ready-v1.bundle
          sha256sum ULLM-experiment-ready-v1.bundle | tee ULLM-experiment-ready-v1.bundle.sha256
          printf '%s\n' '8b4ccab4509e42da7d315e1161085e5a99591181' > FROZEN_COMMIT.txt

      - name: Upload Windows delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: ULLM-experiment-ready-v1-windows
          path: |
            ULLM-experiment-ready-v1.bundle
            ULLM-experiment-ready-v1.bundle.sha256
            FROZEN_COMMIT.txt
          if-no-files-found: error
          retention-days: 7
