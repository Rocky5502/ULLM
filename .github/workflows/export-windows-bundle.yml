name: Export frozen Windows delivery bundle

on:
  push:
    branches: [windows-delivery]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen experiment commit
        uses: actions/checkout@v4
        with:
          ref: b366c167e11641a582bafdb262c0006bda37991a
          fetch-depth: 0

      - name: Create self-contained Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git branch -f experiment-ready-v3 b366c167e11641a582bafdb262c0006bda37991a
          git bundle create ULLM-experiment-ready-v3.bundle experiment-ready-v3
          git bundle verify ULLM-experiment-ready-v3.bundle
          sha256sum ULLM-experiment-ready-v3.bundle | tee ULLM-experiment-ready-v3.bundle.sha256
          printf '%s\n' 'b366c167e11641a582bafdb262c0006bda37991a' > FROZEN_COMMIT.txt

      - name: Upload Windows delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: ULLM-experiment-ready-v3-windows
          path: |
            ULLM-experiment-ready-v3.bundle
            ULLM-experiment-ready-v3.bundle.sha256
            FROZEN_COMMIT.txt
          if-no-files-found: error
          retention-days: 7
