name: Overleaf source

on:
  push:
    paths:
      - 'paper/**'
      - 'scripts/validate_references.py'
      - '.github/workflows/overleaf.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'scripts/validate_references.py'
      - '.github/workflows/overleaf.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit citation keys
        run: python scripts/validate_references.py
      - name: Package exact committed paper tree for Overleaf
        run: |
          git archive --format=zip --output=ULLM_IASEAI27_Overleaf.zip HEAD:paper
          unzip -l ULLM_IASEAI27_Overleaf.zip
      - name: Upload Overleaf source package
        uses: actions/upload-artifact@v4
        with:
          name: ullm-overleaf-source
          path: ULLM_IASEAI27_Overleaf.zip
          if-no-files-found: error
