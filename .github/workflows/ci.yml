name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check
      - name: Compile all Python sources
        run: python -m compileall -q src scripts tests
      - name: Validate frozen project consistency
        env:
          PYTHONPATH: src
        run: python scripts/validate_project.py
      - name: Audit manuscript citation keys
        run: python scripts/validate_references.py
      - name: Enforce pre-run manuscript evidence state
        run: python scripts/manuscript_evidence_gate.py --mode pre
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Validate POSIX frozen-runner syntax
        if: matrix.python-version == '3.11'
        run: bash -n scripts/run_frozen.sh scripts/analyze_frozen.sh
      - name: Validate PowerShell frozen-runner syntax
        if: matrix.python-version == '3.11'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/run_frozen.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/analyze_frozen.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
      - name: Anonymous artifact identity scan
        if: matrix.python-version == '3.11'
        run: python scripts/package_anonymous_artifact.py --check-only
      - name: Zero-API end-to-end analysis smoke
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: src
        run: python scripts/synthetic_pipeline_smoke.py
