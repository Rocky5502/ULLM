name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Validate public artifact invariants
        env:
          PYTHONPATH: src
        run: python scripts/validate_project.py

      - name: Scan tracked files for credentials and local paths
        run: python scripts/security_scan.py

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Validate POSIX runner syntax
        if: matrix.python-version == '3.11'
        run: bash -n scripts/run_frozen.sh scripts/analyze_frozen.sh

      - name: Validate PowerShell runner syntax
        if: matrix.python-version == '3.11'
        shell: pwsh
        run: |
          $files = @(
            'scripts/run_frozen.ps1',
            'scripts/analyze_frozen.ps1',
            'scripts/resume_after_stage5_contract.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse failure: $file"
              $errors | Format-List
              exit 1
            }
          }

      - name: Zero-API end-to-end analysis smoke
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: src
        run: python scripts/synthetic_pipeline_smoke.py
