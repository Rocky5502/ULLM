seed: 42
base_url: https://api.zhizengzeng.com/v1
input_file: data/imperfectiveNLI.json
output_dir: results/raw
max_concurrency: 6
request_timeout_s: 120
max_retries: 6
max_tokens: 220

# Primary protocol is strict but does NOT reveal telicity labels or the gold rule.
# 'bare' is a robustness prompt with minimal instruction.
protocols: [strict, bare]
primary_protocol: strict

deterministic:
  temperature: 0.0
  samples_per_item: 1

sampling:
  enabled: true
  temperature: 0.7
  samples_per_item: 5

# Optional sensitivity: K=10 only for the critical Group C after primary results.
sampling_sensitivity:
  enabled: false
  groups: [C]
  temperature: 0.7
  samples_per_item: 10

selective:
  confidence_threshold: 0.80
  teleological_overconfidence_threshold: 0.80
  threshold_grid: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  target_coverages: [1.00, 0.90, 0.80, 0.70, 0.50]

statistics:
  cluster_key: verb
  bootstrap_replicates: 10000
  confidence_level: 0.95
  multiple_testing: holm
  calibration_bins: 10

labels: [True, False, Unknown]
