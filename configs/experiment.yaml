# Frozen experiment configuration. Change this file only before the paid run and
# commit any change so the run manifest can pin its SHA-256 and Git revision.
seed: 42
base_url: https://api.zhizengzeng.com/v1
input_file: data/imperfectiveNLI.json
output_dir: results/raw
max_concurrency: 6
request_timeout_s: 120
max_retries: 6
max_tokens: 220

# The scientific primary condition is intentionally neutral: it does not teach the
# telicity/imperfective rule whose recognition we are trying to measure.
primary_prompt: neutral

# Fixed, predeclared robustness subset. The runner's balanced_subset() makes the same
# seed-42 A/B/C/D-balanced 120-item subset for every condition.
prompt_robustness:
  n_examples: 120
  prompt_types: [strict_logic, definition_aware]

label_order_robustness:
  n_examples: 120
  alternate_order: [Unknown, False, True]

# The aspect-sensitive prompt is a secondary RQ3 verifier, not a primary predictor.
verifier:
  prompt_type: verifier

deterministic:
  temperature: 0.0
  samples_per_item: 1

sampling:
  enabled: true
  temperature: 0.7
  samples_per_item: 5

# Optional sensitivity is disabled in the frozen primary design. If activated later,
# report it explicitly as a sensitivity analysis rather than replacing K=5.
sampling_sensitivity:
  enabled: false
  groups: [C]
  temperature: 0.7
  samples_per_item: 10

selective:
  teleological_overconfidence_threshold: 0.80
  target_coverages: [1.00, 0.90, 0.80, 0.70, 0.50]
  target_risks: [0.10, 0.05]
  recheck_uncertainty_thresholds: [0.10, 0.20, 0.30, 0.40]
  # One compact manuscript operating point is frozen before results. The full sweep
  # remains primary evidence and is always reported in CSV/figures.
  primary_recheck_signal: 1-maxprob
  primary_recheck_threshold: 0.20

statistics:
  cluster_key: verb
  bootstrap_replicates: 10000
  confidence_level: 0.95
  multiple_testing: holm
  calibration_bins: 15

labels: [True, False, Unknown]
